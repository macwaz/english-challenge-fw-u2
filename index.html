<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><title>Round we go! English Challenge</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef4ff;font:17px system-ui}main{max-width:800px;margin:auto;padding:24px}h1{font-size:32px;margin:8px 0}small,p{color:#b9c9df}button,input,select{font:inherit;border-radius:12px;padding:14px;border:1px solid #435775}button{background:#253a56;color:white;cursor:pointer;text-align:left}button:hover{background:#36567d}button:disabled{opacity:.7;cursor:default}input,select{background:#fff;color:#172337;width:100%}.panel{background:#1a2940;border-radius:20px;padding:24px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.primary{background:#176c9b;text-align:center}.good{color:#78efb1}.bad{color:#ffb0a4}progress{width:100%;accent-color:#58d9a0}#answers{display:grid;gap:10px}#feedback{margin:16px 0;white-space:pre-wrap}button.correct{background:#176846}button.wrong{background:#8c3840} .tag{color:#7ed8ff;font-weight:bold} button{min-height:48px;touch-action:manipulation}input{font-size:18px;min-height:50px}button.primary,#next{width:100%}main{padding: max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}button:focus-visible,input:focus-visible{outline:3px solid #7ed8ff;outline-offset:2px}@media(max-width:520px){.panel{padding:16px;margin:12px 0}.grid{grid-template-columns:1fr}h1{font-size:27px}#answers button{width:100%}} </style><main><div class="tag">UNIT 02 • ENGLISH ADVENTURE</div><h1>Round we go! 🌍</h1><p>Klasa 5 • Twoja misja: opanuj angielski!</p><div id="app"></div></main><script>
const names=['🚲 Transport','🏙️ City Explorer','📈 Comparative','🏆 Superlative','🧭 Navigation','🎫 Train Tickets','🌍 World Explorer'];const bank=names.map(()=>[]);function add(c,q,a,opts=[],hint=''){bank[c].push({c,q,a:a.split('|'),opts,hint})}function vocab(c,pairs){for(const [en,pl] of pairs){add(c,'Przetłumacz na angielski: '+pl,en);add(c,'Co oznacza: '+en+'?',pl,pairs.filter(x=>x[1]!==pl).map(x=>x[1]));}}
vocab(0,[['train','pociąg'],['taxi','taksówka'],['bike|bicycle','rower'],['tram','tramwaj'],['motorcycle|motorbike','motocykl'],['cable car','kolejka linowa'],['plane','samolot'],['bus','autobus'],['helicopter','helikopter'],['car','samochód'],['ship','statek'],['boat','łódź']]);for(const [q,a,h] of [['I go to school ___ bike.','by','by + środek transportu, bez przedimka.'],['She is sitting ___ a bike.','on','on a bike – na rowerze.'],['We go to school ___ foot.','on','Stałe wyrażenie: on foot.'],['He is sitting ___ a taxi.','in','in a taxi – w taksówce.'],['They are ___ a train.','on','on a train – w pociągu.'],['We travel ___ plane.','by','by plane – samolotem.'],['She is ___ a helicopter.','in','in a helicopter – w helikopterze.']])add(0,q,a,['by','on','in'],h);
vocab(1,[['library','biblioteka'],['park','park'],['tube station','stacja metra'],['department store','dom towarowy'],['post office','poczta'],['bookshop','księgarnia'],['music shop','sklep muzyczny'],['clothes shop','sklep odzieżowy'],['toy shop','sklep z zabawkami'],['fishmonger’s|fishmonger\'s','sklep rybny'],['police station','komisariat policji'],['hospital','szpital'],['theatre','teatr'],['museum','muzeum'],['gym','siłownia'],['car park','parking'],['cinema','kino'],['supermarket','supermarket'],['fast food restaurant','restauracja fast food']]);for(const [q,a] of [['Quiet please!','library'],['Beware of the dog!','house'],['Mind the gap!','tube station'],['Do not step on the grass!','park']])add(1,'Gdzie zobaczysz napis: '+q,a,['library','house','tube station','park']);
const adj=[['old','older','the oldest'],['important','more important','the most important'],['heavy','heavier','the heaviest'],['bad','worse','the worst'],['fast','faster','the fastest'],['large','larger','the largest'],['thin','thinner','the thinnest'],['happy','happier','the happiest'],['interesting','more interesting','the most interesting'],['small','smaller','the smallest'],['good','better','the best'],['beautiful','more beautiful','the most beautiful'],['big','bigger','the biggest'],['dangerous','more dangerous','the most dangerous'],['noisy','noisier','the noisiest'],['little','less','the least'],['famous','more famous','the most famous'],['dry','drier','the driest'],['many','more','the most'],['long','longer','the longest'],['exciting','more exciting','the most exciting'],['boring','more boring','the most boring'],['busy','busier','the busiest'],['crowded','more crowded','the most crowded'],['expensive','more expensive','the most expensive'],['warm','warmer','the warmest']];for(const [a,b,c] of adj){add(2,'Stopień wyższy: '+a,b,[],a+' → '+b+' → '+c);add(3,'Stopień najwyższy (z the): '+a,c,[],a+' → '+b+' → '+c)}for(const [q,a,o,h] of [['A plane is ___ than a bus. (fast)','faster',['fast','faster','the fastest'],'than wskazuje na porównanie.'],['This park is as beautiful ___ that park.','as',['than','as','more'],'as … as – tak samo … jak.'],['My bike is not as fast ___ yours.','as',['than','as','the'],'not as … as – nie tak … jak.'],['This is ___ museum in town. (interesting)','the most interesting',['more interesting','the most interesting','interesting'],'Stopień najwyższy: the most + długi przymiotnik.'],['This is ___ day of my holiday. (good)','the best',['better','the best','good'],'good – better – the best']])add(q.includes('This is')?3:2,q,a,o,h);
vocab(4,[['in front of','przed'],['behind','za'],['next to','obok'],['opposite','naprzeciwko'],['between','pomiędzy'],['on the corner of','na rogu'],['turn left','skręć w lewo'],['turn right','skręć w prawo'],['go along','idź wzdłuż'],['take the first left','skręć w pierwszą ulicę w lewo']]);add(4,'MAPA: 🏫 School — 📚 Library — 🏥 Hospital\nThe library is ___ the school and the hospital.','between',['behind','between','opposite']);add(4,'MAPA: 🏫 School\n════════ Street ════════\n🏥 Hospital\nThe hospital is ___ the school.','opposite',['between','behind','opposite']);
for(const [q,a,o] of [['Jak poprosisz o dwa bilety do Bath?','I would like two tickets to Bath, please.',['How much are the tickets?','Single or return?']],['Single or return?','W jedną stronę czy w obie?',['Gotówką czy kartą?','Szybki czy wolny?']],['How much are the tickets?','Ile kosztują bilety?',['Kiedy odjeżdża pociąg?','Gdzie jest dworzec?']],['Can I pay by credit card?','Czy mogę zapłacić kartą?',['Czy mogę zapłacić gotówką?','Czy mogę kupić bilet?']],['When does the train leave?','Kiedy odjeżdża pociąg?',['Ile kosztuje bilet?','Dokąd jedzie pociąg?']],['Bilet w jedną stronę','single ticket',['return ticket','credit card']],['Bilet w obie strony','return ticket',['single ticket','train station']],['Have a nice journey!','Miłej podróży!',['Dzień dobry!','Do zobaczenia!']],['Can I pay in cash?','Czy mogę zapłacić gotówką?',['Czy mogę zapłacić kartą?','Czy mogę wrócić?']]])add(5,q,a,o);
vocab(6,[['cruise','rejs'],['tour','wycieczka'],['sights','atrakcje turystyczne'],['get around','poruszać się'],['environmentally friendly','przyjazny dla środowiska'],['check out','sprawdzić'],['cottage','domek'],['houseboat','łódź mieszkalna'],['flat','mieszkanie'],['view','widok'],['book','zarezerwować'],['quiet','cichy'],['unique','wyjątkowy'],['county','hrabstwo'],['medieval','średniowieczny'],['canal','kanał'],['connect','łączyć'],['glass','szkło'],['brick','cegła'],['wood','drewno'],['steel','stal'],['stone','kamień'],['plastic','plastik'],['bronze','brąz'],['tomb','grobowiec'],['fog','mgła']]);const reading='Read: Tom is visiting London. He travels by bus in the morning. In the afternoon he takes a boat trip on the Thames. His sister prefers cycling.\n\n';for(const [q,a] of [['Tom travels by bus in the morning.','Right'],['Tom takes a helicopter tour in the afternoon.','Wrong'],['Tom is eleven years old.','Doesn’t say'],['His sister prefers cycling.','Right']])add(6,reading+q,a,['Right','Wrong','Doesn’t say']);const r2='Read: A small cottage has a garden and three bedrooms. A houseboat has one bedroom and a kitchen. The cottage costs £140 per day and the houseboat costs £40.\n\n';for(const [q,a] of [['The cottage has a garden.','Right'],['The houseboat is more expensive than the cottage.','Wrong'],['The cottage has a red door.','Doesn’t say']])add(6,r2+q,a,['Right','Wrong','Doesn’t say']);for(const [q,a] of [['What material are the pyramids of Giza made of?','stone'],['What material is the Golden Gate Bridge made of?','steel'],['What material are the lions at Nelson’s Column made of?','bronze']])add(6,q,a,['stone','steel','bronze','wood']);
const app=document.querySelector('#app');let queue=[],i=0,score=0,wrong=[],locked=false,mode='',xp=0,best=0;try{xp=+localStorage.xp||0;best=+localStorage.best||0}catch{}const shuffle=a=>{a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a};const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));function home(){app.innerHTML=`<div class="panel"><div class="tag">⚡ ${xp} XP • Poziom ${1+Math.floor(xp/100)} • Rekord testu: ${best}%</div><p>${bank.flat().length} zadań w bazie. Wybierz misję (15 losowych zadań).</p><div class="grid">${names.map((n,j)=>`<button onclick="start(${j})">${n}<br><small>${bank[j].length} zadań</small></button>`).join('')}</div></div><div class="panel"><button class="primary" onclick="start(-1)">🏆 Sprawdzian końcowy – 35 pytań</button><p>Po 5 pytań z każdej misji. Wynik i błędy na końcu.</p></div>`}function start(c){mode=c===-1?'test':'practice';queue=c===-1?shuffle(bank.flatMap(b=>shuffle(b).slice(0,5))):shuffle(bank[c]).slice(0,15);reset()}function reset(){i=score=0;wrong=[];show()}function show(){if(i>=queue.length)return finish();locked=false;let q=queue[i];let opts=q.opts.length?shuffle([...new Set([q.a[0],...shuffle(q.opts.filter(x=>!q.a.includes(x))).slice(0,3)])]):[];app.innerHTML=`<button onclick="home()">← Menu</button><div class="panel"><div class="tag">${names[q.c]} • ${i+1}/${queue.length} • ${score} pkt</div><progress max="${queue.length}" value="${i}"></progress><h2 style="white-space:pre-wrap;font-size:23px">${esc(q.q.replace('bike|bicycle','bike').replace('motorcycle|motorbike','motorcycle').replace(/fishmonger’s\|fishmonger.s/g,'fishmonger’s'))}</h2><div id="answers"></div><div id="feedback" aria-live="polite"></div><button id="next" class="primary" hidden onclick="i++;show()">Dalej →</button></div>`;let a=document.querySelector('#answers');if(opts.length){opts.forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>check(v,b);a.append(b)})}else{a.innerHTML='<form id="f"><input id="typed" autocomplete="off" placeholder="Wpisz odpowiedź" required><button class="primary" style="margin-top:10px">Sprawdź</button></form>';document.querySelector('#f').onsubmit=e=>{e.preventDefault();check(document.querySelector('#typed').value)}}}const norm=s=>s.toLowerCase().trim().replace(/[’]/g,"'").replace(/[.!?]+$/,'').replace(/\s+/g,' ');function check(v,b){if(locked)return;locked=true;let q=queue[i],ok=q.a.some(x=>norm(x)===norm(v));if(ok){score++;xp+=10;try{localStorage.xp=xp}catch{}}else wrong.push({q,v});document.querySelectorAll('#answers button').forEach(x=>{x.disabled=true;if(q.a.includes(x.textContent))x.classList.add('correct')});if(b&&!ok)b.classList.add('wrong');let inp=document.querySelector('#typed');if(inp)inp.disabled=true;let f=document.querySelector('#feedback');f.className=mode==='test'?'':(ok?'good':'bad');f.textContent=mode==='test'?'Odpowiedź zapisana.':(ok?'✓ Świetnie! +10 XP':'✗ Poprawna odpowiedź: '+q.a.join(' / '))+(q.hint?'\n'+q.hint:'');if(mode==='test')document.querySelectorAll('#answers button').forEach(x=>x.classList.remove('correct','wrong'));document.querySelector('#next').hidden=false}function finish(){let pct=Math.round(100*score/queue.length);if(mode==='test'){best=Math.max(best,pct);try{localStorage.best=best}catch{}}app.innerHTML=`<div class="panel"><h1>${pct>=80?'🏆':'⭐'} ${pct}%</h1><p>${score} / ${queue.length} poprawnych • ${score*10} XP zdobyte</p><button onclick="home()">Menu główne</button> ${wrong.length?'<button class="primary" onclick="retry()">Powtórz błędy</button>':''}</div>${wrong.length?'<div class="panel"><h2>Co warto powtórzyć?</h2>'+wrong.map(({q,v})=>`<p>${esc(q.q)}<br><span class="bad">Twoja odpowiedź: ${esc(v)}</span><br><span class="good">Poprawnie: ${esc(q.a.join(' / '))}</span></p>`).join('')+'</div>':''}`}function retry(){queue=shuffle(wrong.map(x=>x.q));mode='practice';reset()}home();if("serviceWorker" in navigator && location.protocol!=="file:"){navigator.serviceWorker.register("./sw.js").catch(console.warn)}</script></html>
